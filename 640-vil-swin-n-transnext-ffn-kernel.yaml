# Ultralytics YOLO, AGPL-3.0 license
# Explicit ViL/Swin T configuration with BCHW public layout.
# ViL/Swin wrappers handle their internal NHWC conversions.
#
# P2 width reduced: 64 -> 48
# Channel ladder: 48 -> 96 -> 192 -> 384
# Swin-T-style head counts: 3 -> 6 -> 12 -> 24
# Achieved with qkv_block_size: 16 at every stage because:
#   48  // 16 = 3
#   96  // 16 = 6
#   192 // 16 = 12
#   384 // 16 = 24
#
# Chunking policy:
#   Multi-scale training should sample image sizes on a 32px lattice.
#   This keeps patch_size=4 plus three 2x Swin merges on integral grids.
#   mLSTM uses train_with_padding, so non-divisible S=H*W is padded to chunk_size
#   inside the kernel wrapper and sliced back to the original grid afterward.
#   160x160: S=25600, chunk=512
#   80x80:   S=6400,  chunk=256
#   40x40:   S=1600,  chunk=128
#   20x20:   S=400,   chunk=128

nc: 80

backbone:
  - [-1, 1, VitPatchEmbedBlock, [3, 48, [640, 640], [4, 4], null, "xavier_uniform", "bchw"]]  # 0 (B, 48, 160, 160)
  - [-1, 1, VitPosEmbedBlock, [48, 48, [160, 160], true, true, "bchw"]]  # 1

  # 160x160 => S=25,600, chunk_size=512
  # dim=48, qk_dim=24, v_dim=48, heads=3
  - [-1, 1, ViLBlockPairBlock, [48, 48, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 512, ckpt_thresh: 6400, drop_path: 0.0}]]  # 2
  - [-1, 1, ViLBlockPairBlock, [48, 48, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 512, ckpt_thresh: 25600, drop_path: 0.009}]]  # 3

  - [-1, 1, SwinPatchMergeBlock, [48, 96]]  # 4 (160 -> 80)

  # 80x80 => S=6,400, chunk_size=256
  # dim=96, qk_dim=48, v_dim=96, heads=6
  - [-1, 1, ViLBlockPairBlock, [96, 96, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 256, ckpt_thresh: 25600, drop_path: 0.018}]]  # 5
  - [-1, 1, ViLBlockPairBlock, [96, 96, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 256, ckpt_thresh: 25600, drop_path: 0.027}]]  # 6

  - [-1, 1, SwinPatchMergeBlock, [96, 192]]  # 7 (80 -> 40)

  # 40x40 => S=1,600, pad to 1,664, chunk_size=128
  # dim=192, qk_dim=96, v_dim=192, heads=12
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.036}]]  # 8
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.045}]]  # 9
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.055}]]  # 10
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.064}]]  # 11
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.073}]]  # 12
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.082}]]  # 13

  - [-1, 1, SwinPatchMergeBlock, [192, 384]]  # 14 (40 -> 20)

  # 20x20 => S=400, pad to 512, chunk_size=128
  # dim=384, qk_dim=192, v_dim=384, heads=24
  - [-1, 1, ViLBlockPairBlock, [384, 384, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.091}]]  # 15
  - [-1, 1, ViLBlockPairBlock, [384, 384, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.10}]]  # 16

head:
  - [-1, 1, SPPF, [384, 5]]  # 17 (B, 384, 20, 20)

  - [-1, 1, Conv, [192, 1, 1]]  # 18 (B, 192, 20, 20)
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 19 (B, 192, 40, 40)

  - [[-1, 13], 1, Concat, [1]]  # 20 (B, 384, 40, 40)

  # 40x40 => S=1,600, pad to 1,664, chunk_size=128
  # output dim=192, heads=12
  - [-1, 1, ViLFusionBlock, [384, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 128, ckpt_thresh: 25600}]]  # 21

  - [-1, 1, Conv, [96, 1, 1]]  # 22 (B, 96, 40, 40)
  - [-1, 1, Upsample, [None, 2, "nearest"]]  # 23 (B, 96, 80, 80)

  - [[-1, 6], 1, Concat, [1]]  # 24 (B, 192, 80, 80)

  # 80x80 => S=6,400, chunk_size=256
  # output dim=96, heads=6
  - [-1, 1, ViLFusionBlock, [192, 96, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 256, ckpt_thresh: 25600}]]  # 25

  - [-1, 1, Conv, [96, 3, 2]]  # 26 (B, 96, 40, 40)
  - [[-1, 21], 1, Concat, [1]]  # 27 (B, 288, 40, 40)

  # 40x40 => S=1,600, pad to 1,664, chunk_size=128
  # output dim=192, heads=12
  - [-1, 1, ViLFusionBlock, [288, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 0.5, v_dim_factor: 1.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 128, ckpt_thresh: 25600}]]  # 28

  - [-1, 1, Conv, [192, 3, 2]]  # 29 (B, 192, 20, 20)
  - [[-1, 17], 1, Concat, [1]]  # 30 (B, 576, 20, 20)

  # 20x20 => S=400, pad to 512, chunk_size=128
  # output dim=384, heads=24
  - [-1, 1, ViLFusionBlock, [576, 384, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 0.5, v_dim_factor: 1.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 128, ckpt_thresh: 25600}]]  # 31

  - [[25, 28, 31], 1, v10Detect, [nc]]  # 32