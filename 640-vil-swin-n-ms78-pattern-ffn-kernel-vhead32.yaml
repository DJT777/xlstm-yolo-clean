# Ultralytics YOLO, AGPL-3.0 license
# multi-scale78-style ViL/Swin topology with nano TransNeXt/FFN kernel block configs.
# Public layout is BCHW; ViL/Swin wrappers handle their internal NHWC conversions.
#
# Design pattern copied from the saved multi-scale78 checkpoint:
#   - Channel ladder: 48 -> 96 -> 192 -> 384
#   - Backbone depth: 1 / 1 / 3 / 1
#   - Swin patch merge down path
#   - Swin patch expand top-down head
#   - ViL fusion PAFPN
#
# Layer configs mirror 640-vil-swin-n-transnext-ffn-kernel.yaml:
#   - P2 uses 2 wider heads for the high-resolution mLSTM launch; later stages use 6/12/24
#   - qk_dim_factor=1.0, v_dim_factor=2.0 for qk:v = 1:2 with v/head=32
#   - SwiGLU FFN in backbone ViL blocks
#   - chunk sizes: 512 / 256 / 128 / 128
#   - ckpt_thresh set for padded/chunked mLSTM kernels
#
# drop_path is held at 0.0 to match the high-performing multi-scale78 recipe.

nc: 80

backbone:
  - [-1, 1, VitPatchEmbedBlock, [3, 48, [640, 640], [4, 4], null, "xavier_uniform", "bchw"]]  # 0 (B, 48, 160, 160)
  - [-1, 1, VitPosEmbedBlock, [48, 48, [160, 160], true, true, "bchw"]]  # 1

  # 160x160 => S=25,600, chunk_size=512; dim=48, heads=2
  - [-1, 1, ViLBlockPairBlock, [48, 48, {qkv_block_size: 24, traversal: 'row', qk_dim_factor: 1.0, v_dim_factor: 2.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 512, ckpt_thresh: 6400, drop_path: 0.0}]]  # 2

  - [-1, 1, SwinPatchMergeBlock, [48, 96]]  # 3 (160 -> 80)

  # 80x80 => S=6,400, chunk_size=256; dim=96, heads=6
  - [-1, 1, ViLBlockPairBlock, [96, 96, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 1.0, v_dim_factor: 2.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 256, ckpt_thresh: 25600, drop_path: 0.0}]]  # 4

  - [-1, 1, SwinPatchMergeBlock, [96, 192]]  # 5 (80 -> 40)

  # 40x40 => S=1,600, pad to 1,664, chunk_size=128; dim=192, heads=12
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 1.0, v_dim_factor: 2.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.0}]]  # 6
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 1.0, v_dim_factor: 2.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.0}]]  # 7
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 1.0, v_dim_factor: 2.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.0}]]  # 8

  - [-1, 1, SwinPatchMergeBlock, [192, 384]]  # 9 (40 -> 20)

  # 20x20 => S=400, pad to 512, chunk_size=128; dim=384, heads=24
  - [-1, 1, ViLBlockPairBlock, [384, 384, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 1.0, v_dim_factor: 2.0, ffn_proj_factor: 2.6667, use_ffn: true, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, chunk_size: 128, ckpt_thresh: 25600, drop_path: 0.0}]]  # 10

head:
  - [-1, 1, SPPF, [384, 5]]  # 11 (B, 384, 20, 20)

  # P5 -> P4, preserving the multi-scale78 Swin-expand head pattern.
  - [-1, 1, SwinPatchExpandBlock, [384, 384]]  # 12 (B, 384, 40, 40)
  - [[-1, 8], 1, Concat, [1]]  # 13 (B, 576, 40, 40)
  - [-1, 1, ViLFusionBlock, [576, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 1.0, v_dim_factor: 2.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 128, ckpt_thresh: 25600}]]  # 14

  # P4 -> P3.
  - [-1, 1, SwinPatchExpandBlock, [192, 192]]  # 15 (B, 192, 80, 80)
  - [[-1, 4], 1, Concat, [1]]  # 16 (B, 288, 80, 80)
  - [-1, 1, ViLFusionBlock, [288, 192, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 1.0, v_dim_factor: 2.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 256, ckpt_thresh: 25600}]]  # 17

  # Bottom-up PAFPN.
  - [-1, 1, Conv, [192, 3, 2]]  # 18 (B, 192, 40, 40)
  - [[-1, 14], 1, Concat, [1]]  # 19 (B, 384, 40, 40)
  - [-1, 1, ViLFusionBlock, [384, 192, {qkv_block_size: 16, traversal: 'column', qk_dim_factor: 1.0, v_dim_factor: 2.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 128, ckpt_thresh: 25600}]]  # 20

  - [-1, 1, Conv, [192, 3, 2]]  # 21 (B, 192, 20, 20)
  - [[-1, 11], 1, Concat, [1]]  # 22 (B, 576, 20, 20)
  - [-1, 1, ViLFusionBlock, [576, 384, {qkv_block_size: 16, traversal: 'row', qk_dim_factor: 1.0, v_dim_factor: 2.0, use_ffn: false, ffn_type: 'swiglu', ffn_conv_kernel_size: 3, ffn_drop: 0.0, ffn_layer_scale_init: 1.0e-4, mlp_ratio: 4.0, chunk_size: 128, ckpt_thresh: 25600}]]  # 23

  - [[17, 20, 23], 1, Detect, [nc]]  # 24
