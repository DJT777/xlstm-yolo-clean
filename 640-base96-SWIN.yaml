# Ultralytics YOLO, AGPL-3.0 license
# Swin/ViL configuration with BCHW public layout.
# ViL/Swin wrappers handle their internal NHWC conversions.

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, VitPatchEmbedBlock, [3, 48, [640, 640], [4, 4], null, "xavier_uniform", "bchw"]]  # 0 (B, 48, 160, 160)
  - [-1, 1, VitPosEmbedBlock, [48, 48, [160, 160], true, true, "bchw"]]                       # 1
  - [-1, 1, ViLBlockPairBlock, [48, 48, {qkv_block_size: 32, traversal: 'row'}]]              # 2
  - [-1, 1, SwinPatchMergeBlock, [48, 96]]                                                    # 3 (160 -> 80)
  - [-1, 1, ViLBlockPairBlock, [96, 96, {qkv_block_size: 32, traversal: 'row'}]]              # 4
  - [-1, 1, SwinPatchMergeBlock, [96, 192]]                                                   # 5 (80 -> 40)
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 32, traversal: 'row'}]]            # 6
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 32, traversal: 'column'}]]         # 7
  - [-1, 1, ViLBlockPairBlock, [192, 192, {qkv_block_size: 32, traversal: 'row'}]]            # 8
  - [-1, 1, SwinPatchMergeBlock, [192, 384]]                                                  # 9 (40 -> 20)
  - [-1, 1, ViLBlockPairBlock, [384, 384, {qkv_block_size: 64, traversal: 'row'}]]            # 10

head:
  - [-1, 1, SPPF, [384, 5]]                 # 11 (B, 384, 20, 20)

  # P5 -> P4
  - [-1, 1, SwinPatchExpandBlock, [384, 192]]   # 12 (B, 192, 40, 40)
  - [[-1, 8], 1, Concat, [1]]                   # 13 (B, 384, 40, 40)
  # Start PAFPN alternation opposite of backbone tap at layer 8 (row -> column)
  - [-1, 1, ViLFusionBlock, [384, 192, {qkv_block_size: 32, traversal: 'column'}]] # 14 (B, 192, 40, 40)

  # P4 -> P3
  - [-1, 1, SwinPatchExpandBlock, [192, 96]]    # 15 (B, 96, 80, 80)
  - [[-1, 4], 1, Concat, [1]]                   # 16 (B, 192, 80, 80)
  # Alternate (column -> row)
  - [-1, 1, ViLFusionBlock, [192, 96, {qkv_block_size: 32, traversal: 'row'}]]     # 17 (B, 96, 80, 80)

  # Bottom-up
  - [-1, 1, Conv, [96, 3, 2]]   # 18 (B, 96, 40, 40)
  - [[-1, 14], 1, Concat, [1]]  # 19 (B, 288, 40, 40)
  # Alternate (row -> column)
  - [-1, 1, ViLFusionBlock, [288, 192, {qkv_block_size: 32, traversal: 'column'}]] # 20 (B, 192, 40, 40)

  - [-1, 1, Conv, [192, 3, 2]]  # 21 (B, 192, 20, 20)
  - [[-1, 11], 1, Concat, [1]]  # 22 (B, 576, 20, 20)
  # Alternate (column -> row)
  - [-1, 1, ViLFusionBlock, [576, 384, {qkv_block_size: 32, traversal: 'row'}]]    # 23 (B, 384, 20, 20)

  - [[17, 20, 23], 1, v10Detect, [nc]] # 24
